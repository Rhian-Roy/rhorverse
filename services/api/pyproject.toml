[project]
name = "rhorverse-api"
version = "0.1.0"
description = "Rhorverse cross-media recommender API"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]
# Local-only: embeddings with sentence-transformers on Apple MPS.
# Never installed by default or in the Docker image. Use `uv sync --group ml`.
ml = [
    "torch>=2.5",
    "sentence-transformers>=3.3",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhorverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["rhorverse"]
